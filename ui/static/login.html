<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · {{PRODUCT}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    .login-card {
      width: min(420px, 100%);
      padding: 1.75rem 1.5rem 1.5rem;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,45,98,0.14);
    }
    .login-card h1 {
      margin: 0.75rem 0 0.35rem;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 1.85rem;
      color: #002d62;
    }
    .login-card p {
      margin: 0 0 1.25rem;
      color: #5a6b82;
      line-height: 1.45;
    }
    .login-card label {
      display: block;
      margin: 0.75rem 0 0.35rem;
      font-size: 0.92rem;
      color: #002d62;
    }
    .login-card input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid rgba(0,45,98,0.25);
      background: #f7f9fc;
      color: #002d62;
      font: inherit;
    }
    .login-card .btn {
      width: 100%;
      margin-top: 1.15rem;
      justify-content: center;
    }
    .login-err {
      min-height: 1.25rem;
      margin-top: 0.75rem;
      color: #9b2c2c;
      font-size: 0.9rem;
    }
    .login-logo {
      width: 4.5rem;
      height: auto;
      border: 1px solid rgba(0,45,98,0.14);
      padding: 0.35rem;
      background: #fff;
    }
    .login-profile {
      margin-top: 1rem;
      border-top: 1px solid rgba(0,45,98,0.12);
      padding-top: 0.75rem;
    }
    .login-profile summary {
      cursor: pointer;
      color: #002d62;
      font-size: 0.92rem;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <img class="login-logo" src="/brand/brownhawke-logo.jpg" alt="BrownHawke Engineering" width="72" height="69" />
      <h1>{{PRODUCT}}</h1>
      <p>BrownHawke Engineering work platform — <code>@brownhawke.engineering</code> email required. Free local model all day; Cursor &amp; Grok take the hard jobs.</p>
      <label for="user">Work email</label>
      <input id="user" name="email" type="email" autocomplete="username" placeholder="you@brownhawke.engineering" required />
      <label for="pass">Password</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required />
      <details class="login-profile">
        <summary>First-time profile (name + employee #)</summary>
        <label for="firstName">First name</label>
        <input id="firstName" name="first_name" autocomplete="given-name" />
        <label for="lastName">Last name</label>
        <input id="lastName" name="last_name" autocomplete="family-name" />
        <label for="empNo">Employee number</label>
        <input id="empNo" name="employee_number" autocomplete="off" placeholder="BH-0042" />
      </details>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="login-err" id="err" role="alert"></p>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const email = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value;
      const first_name = document.getElementById("firstName").value.trim();
      const last_name = document.getElementById("lastName").value.trim();
      const employee_number = document.getElementById("empNo").value.trim();
      try {
        const body = { email, username: email, password };
        if (first_name) body.first_name = first_name;
        if (last_name) body.last_name = last_name;
        if (employee_number) body.employee_number = employee_number;
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok || data.ok === false) {
          err.textContent = data.error || "Login failed";
          return;
        }
        location.href = "/";
      } catch (e) {
        err.textContent = String(e.message || e);
      }
    });
  </script>
</body>
</html>
